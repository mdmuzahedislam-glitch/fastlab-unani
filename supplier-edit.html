<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মার্কেটিং অফিসার ও ডিলার ম্যানেজমেন্ট প্যানেল - ফাস্টল্যাব ইউনানী</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        .forest-green { background-color: #064e3b; }
        .forest-green-text { color: #064e3b; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">

    <header class="forest-green text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-user-gear"></i> মার্কেটিং অফিসার ও ডিলার এডিট প্যানেল
        </h1>
        <a href="admin-dashboard.html" class="bg-amber-400 text-black px-4 py-1.5 rounded-lg font-bold text-sm hover:bg-amber-500 transition">ড্যাশবোর্ড</a>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6 flex-grow w-full">
        
        <!-- ১. মার্কেটিং অফিসার প্রোফাইল এডিট -->
        <section class="bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-800">
            <h2 class="text-base font-bold forest-green-text mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-pen"></i> মার্কেটিং অফিসার প্রোফাইল আপডেট
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 text-sm">
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">অফিসারের নাম:</label>
                    <input type="text" id="m-name" placeholder="নাম লিখুন" class="w-full border p-2.5 rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">মোবাইল নাম্বার:</label>
                    <input type="text" id="m-phone" placeholder="মোবাইল নাম্বার" class="w-full border p-2.5 rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">মার্কেটিং এরিয়া:</label>
                    <input type="text" id="m-area" placeholder="এরিয়ার নাম" class="w-full border p-2.5 rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">প্রোফাইল ছবির লিংক (URL):</label>
                    <input type="text" id="m-photo" placeholder="ছবির লিংক দিন" class="w-full border p-2.5 rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">লগইন ইউজার আইডি (Username):</label>
                    <input type="text" id="m-userid" placeholder="Username" class="w-full border p-2.5 rounded-lg">
                </div>
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">পাসওয়ার্ড:</label>
                    <input type="text" id="m-pass" placeholder="Password" class="w-full border p-2.5 rounded-lg">
                </div>
            </div>
            <button onclick="saveMarketingProfile()" class="forest-green text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-green-900 transition">
                প্রোফাইল সংরক্ষণ করুন
            </button>
        </section>

        <!-- ২. নোটিশ বোর্ড এডিট -->
        <section class="bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-800">
            <h2 class="text-base font-bold forest-green-text mb-4 flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> নোটিশ বোর্ড এডিট
            </h2>
            <div class="space-y-3 text-sm">
                <input type="text" id="notice-1" placeholder="১ম নোটিশ লিখুন..." class="w-full border p-2.5 rounded-lg">
                <input type="text" id="notice-2" placeholder="২য় নোটিশ লিখুন..." class="w-full border p-2.5 rounded-lg">
                <input type="text" id="notice-3" placeholder="৩য় নোটিশ লিখুন..." class="w-full border p-2.5 rounded-lg">
            </div>
            <button onclick="saveMarketingNotices()" class="mt-4 forest-green text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-green-900 transition">
                নোটিশ সংরক্ষণ করুন
            </button>
        </section>

    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDmiZ7Pa0nB9HF29bv6qoT2qSzko4RVEHI",
            authDomain: "fastlab-unani.firebaseapp.com",
            databaseURL: "https://fastlab-unani-default-rtdb.firebaseio.com",
            projectId: "fastlab-unani",
            storageBucket: "fastlab-unani.firebasestorage.app",
            messagingSenderId: "1319654847",
            appId: "1:1319654847:web:cdb5c4813ea8e48877fd0a",
            measurementId: "G-LDL48BEM76"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // পেজ লোড হলে আগের ডাটা ফর্ম ইনপুটে নিয়ে আসা
        window.onload = function() {
            db.ref('fastlab_marketing_data/profile').once('value', snapshot => {
                const data = snapshot.val();
                if(data) {
                    document.getElementById('m-name').value = data.name || '';
                    document.getElementById('m-phone').value = data.phone || '';
                    document.getElementById('m-area').value = data.area || '';
                    document.getElementById('m-photo').value = data.photo || '';
                    document.getElementById('m-userid').value = data.userId || '';
                    document.getElementById('m-pass').value = data.pass || '';
                }
            });

            db.ref('fastlab_marketing_data/notices').once('value', snapshot => {
                const data = snapshot.val();
                if(data) {
                    document.getElementById('notice-1').value = data.n1 || '';
                    document.getElementById('notice-2').value = data.n2 || '';
                    document.getElementById('notice-3').value = data.n3 || '';
                }
            });
        };

        // প্রোফাইল সেভ ফাংশন
        function saveMarketingProfile() {
            const profileData = {
                name: document.getElementById('m-name').value,
                phone: document.getElementById('m-phone').value,
                area: document.getElementById('m-area').value,
                photo: document.getElementById('m-photo').value,
                userId: document.getElementById('m-userid').value,
                pass: document.getElementById('m-pass').value
            };

            db.ref('fastlab_marketing_data/profile').set(profileData)
                .then(() => alert("মার্কেটিং অফিসারের প্রোফাইল সফলভাবে আপডেট হয়েছে!"))
                .catch(err => alert("ত্রুটি: " + err.message));
        }

        // নোটিশ সেভ ফাংশন
        function saveMarketingNotices() {
            const noticesData = {
                n1: document.getElementById('notice-1').value,
                n2: document.getElementById('notice-2').value,
                n3: document.getElementById('notice-3').value
            };

            db.ref('fastlab_marketing_data/notices').set(noticesData)
                .then(() => alert("নোটিশ বোর্ড সফলভাবে আপডেট হয়েছে!"))
                .catch(err => alert("ত্রুটি: " + err.message));
        }
    </script>
</body>
</html>
