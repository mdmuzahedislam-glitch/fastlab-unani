<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অফিসার প্যানেল - ফাস্টল্যাব ইউনানী</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

    <header class="bg-emerald-700 text-white shadow-md p-4 text-center relative">
        <h1 class="text-2xl font-bold">ফাস্টল্যাব ইউনানী - এরিয়া অফিসার প্যানেল</h1>
        <p id="officer-welcome" class="text-xs text-emerald-100">স্বাগতম</p>
        <button onclick="logout()" class="absolute right-4 top-4 bg-rose-800 hover:bg-rose-700 text-xs text-white px-3 py-1.5 rounded-lg transition">লগআউট</button>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <div class="bg-white p-6 rounded-xl shadow space-y-4">
            <h2 class="font-bold text-lg text-emerald-800">আমার এলাকার পার্টি ও ডিলার লেজার</h2>
            <p class="text-xs text-gray-500">আপনি শুধুমাত্র আপনার আন্ডারে থাকা ডিলারদের বকেয়া এবং স্টেটমেন্ট দেখতে পারবেন।</p>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse border border-slate-200">
                    <thead class="bg-slate-100 text-slate-700">
                        <tr>
                            <th class="border p-2 text-center">ক্রমিক</th>
                            <th class="border p-2">পার্টির নাম</th>
                            <th class="border p-2">এরিয়া</th>
                            <th class="border p-2 text-right">মাল নেওয়া</th>
                            <th class="border p-2 text-right">টাকা পরিশোধ</th>
                            <th class="border p-2 text-right">বর্তমান বকেয়া</th>
                        </tr>
                    </thead>
                    <tbody id="officer-party-table">
                        <tr>
                            <td class="border p-2 text-center">১</td>
                            <td class="border p-2">মেসার্স ভাই ভাই স্টোর</td>
                            <td class="border p-2">পাবনা সদর</td>
                            <td class="border p-2 text-right text-emerald-700">৳ ১৫,০০০</td>
                            <td class="border p-2 text-right text-rose-700">৳ ৫,০০০</td>
                            <td class="border p-2 text-right font-bold text-amber-700">৳ ১০,০০০</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('role') !== 'officer') {
            window.location.href = 'index.html';
        }
        document.getElementById('officer-welcome').innerText = `ইউজার: ${localStorage.getItem('username')}`;

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
