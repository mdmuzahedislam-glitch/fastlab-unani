<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফাস্টল্যাব ইউনানী - লগইন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm space-y-4 text-center">
        <div class="bg-emerald-100 p-3 rounded-full w-16 h-16 mx-auto flex items-center justify-center text-emerald-700 font-bold text-2xl">
            🔒
        </div>
        <h2 class="text-xl font-bold text-slate-800">ফাস্টল্যাব ইউনানী</h2>
        <p class="text-xs text-gray-500">ম্যানেজমেন্ট সিস্টেমে প্রবেশ করতে লগইন করুন</p>
        
        <div class="space-y-3 text-left">
            <div>
                <label class="text-xs font-semibold text-gray-600">ইউজারনেম (admin বা officer1)</label>
                <input type="text" id="login-user" value="admin" class="w-full border p-2 rounded-lg text-sm mt-1 focus:outline-none focus:border-emerald-600">
            </div>
            <div>
                <label class="text-xs font-semibold text-gray-600">পাসওয়ার্ড (admin বা officer)</label>
                <input type="password" id="login-pass" value="admin" class="w-full border p-2 rounded-lg text-sm mt-1 focus:outline-none focus:border-emerald-600">
            </div>
        </div>

        <p id="login-error" class="text-xs text-rose-600 hidden font-semibold">ভুল ইউজারনেম বা পাসওয়ার্ড!</p>

        <button onclick="checkLogin()" class="w-full bg-emerald-700 text-white py-2 rounded-lg font-semibold hover:bg-emerald-800 transition">লগইন করুন</button>
    </div>

    <script>
        function checkLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            
            if (u === 'admin' && p === 'admin') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('role', 'admin');
                localStorage.setItem('username', 'admin');
                window.location.href = 'admin-dashboard.html';
            } else if (u.startsWith('officer') && p === 'officer') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('role', 'officer');
                localStorage.setItem('username', u);
                window.location.href = 'officer-dashboard.html';
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
