<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফাস্টল্যাব ইউনানী - পাবনা শাখা</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: {
                            600: '#166534',
                            700: '#14532d',
                            800: '#064e3b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans antialiased">

    <!-- Login Section -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-100 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-forest-50 text-forest-700 rounded-full text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">ফাস্টল্যাব ইউনানী</h1>
                <p class="text-slate-500 text-sm mt-1">পাবনা শাখা - একাউন্টস এডমিন প্যানেল</p>
            </div>

            <div id="error-alert" class="hidden mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r-lg">
                <span id="error-text">রং ইউজার আইডি বা পাসওয়ার্ড! সঠিক তথ্য দিন।</span>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">ইউজার আইডি</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="user-id" required class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-forest-600 focus:bg-white transition" placeholder="ইউজার আইডি দিন">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">পাসওয়ার্ড</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-forest-600 focus:bg-white transition" placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-forest-700 hover:bg-forest-800 text-white font-medium rounded-xl shadow-lg shadow-forest-700/20 transition duration-200">
                    লগইন করুন
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section (Initially Hidden) -->
    <div id="dashboard-section" class="hidden min-h-screen flex-col">
        <!-- Navbar -->
        <header class="bg-forest-800 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-forest-700 rounded-lg flex items-center justify-center text-lg shadow">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">ফাস্টল্যাব ইউনানী</h2>
                        <p class="text-xs text-forest-200">পাবনা শাখা</p>
                    </div>
                </div>

                <div class="relative">
                    <button onclick="toggleMenu()" class="flex items-center space-x-3 focus:outline-none bg-forest-700 hover:bg-forest-600 px-3 py-2 rounded-xl transition">
                        <div class="w-8 h-8 bg-white text-forest-800 rounded-full flex items-center justify-center font-bold text-sm">
                            <i class="fa-solid fa-user-shield"></i>
                        </div>
                        <span id="profile-name" class="font-medium text-sm hidden sm:inline">মোঃ আব্দুল রহিম</span>
                        <i class="fa-solid fa-chevron-down text-xs text-forest-200"></i>
                    </button>

                    <!-- Dropdown Menu (পাসওয়ার্ড পরিবর্তনের অপশন স্থায়ীভাবে সরানো হয়েছে) -->
                    <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-2 text-slate-700">
                        <button onclick="handleLogout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center space-x-2 transition">
                            <i class="fa-solid fa-right-from-bracket w-5"></i>
                            <span>লগআউট</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <h3 class="text-xl font-bold text-slate-800 mb-2">একাউন্টস ড্যাশবোর্ড ও রিয়েলটাইম ডেটা</h3>
                <p class="text-slate-500 text-sm">অন্যান্য স্থান থেকে লগইন করে লাইভ ডেটা দেখতে ও আপডেট করতে পারবেন।</p>
            </div>
        </main>
    </div>
      <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDmiZ7Pa0nB9HF29bv6qoT2qSzko4RVEHI",
            authDomain: "fastlab-unani.firebaseapp.com",
            projectId: "fastlab-unani",
            storageBucket: "fastlab-unani.firebasestorage.app",
            messagingSenderId: "1319654847",
            appId: "1:1319654847:web:cdb5c4813ea8e48877fd0a",
            measurementId: "G-LDL48BEM76"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let systemAuth = {
            id: "supplier01",
            pass: "Unani02",
            name: "মোঃ আব্দুল রহিম"
        };

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdown-menu');
            menu.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdown-menu');
            const btn = e.target.closest('button');
            if (!menu.contains(e.target) && (!btn || !btn.getAttribute('onclick')?.includes('toggleMenu'))) {
                menu.classList.add('hidden');
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const inputId = document.getElementById('user-id').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('error-alert');

            if (inputId === systemAuth.id && inputPass === systemAuth.pass) {
                errorAlert.classList.add('hidden');
                document.getElementById('profile-name').innerText = systemAuth.name;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('flex');
                
                // ফায়ারবেজ থেকে লাইভ ডেটা লোড করার ফাংশন
                loadRealtimeData();
            } else {
                errorAlert.classList.remove('hidden');
                document.getElementById('error-text').innerText = "ভুল ইউজার আইডি বা পাসওয়ার্ড! সঠিক তথ্য দিন।";
            }
        }

        function handleLogout() {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('flex');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('user-id').value = '';
            document.getElementById('password').value = '';
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('dropdown-menu').classList.add('hidden');
        }

        function loadRealtimeData() {
            database.ref('fastlab_data/').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    console.log("Realtime Data Synced:", data);
                }
            });
        }
    </script>
</body>
</html>
