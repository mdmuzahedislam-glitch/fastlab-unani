<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মার্কেটিং অফিসার এডিট প্যানেল - ফাস্টল্যাব ইউনানী</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0fdf4; }
        .forest-green { background-color: #064e3b; }
        .forest-green-text { color: #064e3b; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <!-- হেডার বা নবার -->
    <header class="forest-green text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-user-gear"></i> মার্কেটিং অফিসার কন্ট্রোল ও এডিট প্যানেল
        </h1>
        <a href="marketing-dashboard (1).html" target="_blank" class="bg-amber-400 text-black px-4 py-2 rounded-lg font-bold hover:bg-amber-500 transition text-sm">ড্যাশবোর্ড দেখুন</a>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6 flex-grow w-full">
        
        <!-- ১. মার্কেটিং অফিসার প্রোফাইল এডিট সেকশন -->
        <section class="bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-800">
            <h2 class="text-base font-bold forest-green-text mb-4 flex items-center gap-2">
                <i class="fa-solid fa-user-pen"></i> মার্কেটিং অফিসারের তথ্য পরিবর্তন করুন
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">অফিসারের নাম:</label>
                    <input type="text" id="edit-name" placeholder="নাম লিখুন" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">মোবাইল নাম্বার:</label>
                    <input type="text" id="edit-phone" placeholder="মোবাইল নাম্বার" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">মার্কেটিং এরিয়া:</label>
                    <input type="text" id="edit-area" placeholder="এরিয়া লিখুন" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">লগইন ইউজার আইডি (Username):</label>
                    <input type="text" id="edit-userid" placeholder="ইউজার আইডি" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-700 mb-1">লগইন পাসওয়ার্ড (Password):</label>
                    <input type="text" id="edit-pass" placeholder="পাসওয়ার্ড লিখুন" class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
            </div>
            <button onclick="saveProfile()" class="forest-green text-white px-5 py-2.5 rounded-lg font-bold hover:bg-green-900 transition text-sm shadow">
                <i class="fa-solid fa-save mr-1"></i> প্রোফাইল সংরক্ষণ করুন
            </button>
        </section>

        <!-- ২. নোটিশ বোর্ড এডিট সেকশন -->
        <section class="bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-800">
            <h2 class="text-base font-bold forest-green-text mb-4 flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> নোটিশ বোর্ড এডিট প্যানেল
            </h2>
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">নোটিশ ১:</label>
                    <input type="text" id="notice-1" placeholder="প্রথম নোটিশ লিখুন..." class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">নোটিশ ২:</label>
                    <input type="text" id="notice-2" placeholder="দ্বিতীয় নোটিশ লিখুন..." class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">নোটিশ ৩:</label>
                    <input type="text" id="notice-3" placeholder="তৃতীয় নোটিশ লিখুন..." class="w-full border p-2.5 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
                </div>
            </div>
            <button onclick="saveNotices()" class="forest-green text-white px-5 py-2.5 rounded-lg font-bold hover:bg-green-900 transition text-sm shadow">
                <i class="fa-solid fa-save mr-1"></i> নোটিশ সংরক্ষণ করুন
            </button>
        </section>

    </main>

    <!-- Footer -->
    <footer class="mt-12 bg-white border-t py-4 text-center text-xs text-gray-500">
        © ২০২৬ - ফাস্টল্যাব ইউনানী | সকল স্বত্ব সংরক্ষিত
    </footer>

    <!-- Firebase Script & Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDmiZ7Pa0nB9HF29bv6qoT2qSzko4RVEHI",
            authDomain: "fastlab-unani.firebaseapp.com",
            databaseURL: "https://fastlab-unani-default-rtdb.firebaseio.com",
            projectId: "fastlab-unani",
            storageBucket: "fastlab-unani.firebasestorage.app",
            messagingSenderId: "1319654847",
            appId: "1:1319654847:web:cdb5c4813ea8e48877fd0a",
            measurementId: "G-LDL48BEM76"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        // পেজ লোড হলে ডাটাবেস থেকে বর্তমান তথ্য ফর্মের ইনপুটে নিয়ে আসা
        window.onload = function() {
            // প্রোফাইল ডাটা লোড
            database.ref('fastlab_marketing_data/profile').once('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('edit-name').value = data.name || '';
                    document.getElementById('edit-phone').value = data.phone || '';
                    document.getElementById('edit-area').value = data.area || '';
                    document.getElementById('edit-userid').value = data.userId || '';
                    document.getElementById('edit-pass').value = data.pass || '';
                }
            });

            // নোটিশ ডাটা লোড
            database.ref('fastlab_marketing_data/notices').once('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('notice-1').value = data.n1 || '';
                    document.getElementById('notice-2').value = data.n2 || '';
                    document.getElementById('notice-3').value = data.n3 || '';
                }
            });
        };

        // প্রোফাইল সংরক্ষণ ফাংশন
        function saveProfile() {
            const name = document.getElementById('edit-name').value;
            const phone = document.getElementById('edit-phone').value;
            const area = document.getElementById('edit-area').value;
            const userId = document.getElementById('edit-userid').value;
            const pass = document.getElementById('edit-pass').value;

            database.ref('fastlab_marketing_data/profile').set({
                name, phone, area, userId, pass
            }).then(() => {
                alert("মার্কেটিং অফিসারের তথ্য সফলভাবে আপডেট হয়েছে!");
            }).catch(error => {
                alert("ত্রুটি: " + error.message);
            });
        }

        // নোটিশ সংরক্ষণ ফাংশন
        function saveNotices() {
            const n1 = document.getElementById('notice-1').value;
            const n2 = document.getElementById('notice-2').value;
            const n3 = document.getElementById('notice-3').value;

            database.ref('fastlab_marketing_data/notices').set({
                n1, n2, n3
            }).then(() => {
                alert("নোটিশ বোর্ড সফলভাবে আপডেট হয়েছে!");
            }).catch(error => {
                alert("ত্রুটি: " + error.message);
            });
        }
    </script>
</body>
</html>
