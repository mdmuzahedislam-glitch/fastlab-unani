<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>স্টক ম্যান এন্ট্রি - ফাস্টল্যাব ইউনানী</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #f3f6f4; }
    .brand-green { background-color: #064e3b; }
    .brand-green-dark { background-color: #04392b; }
  </style>
</head>
<body class="min-h-screen text-gray-800">
  <!-- লগইন স্ক্রিন -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden border border-emerald-100">
      <div class="brand-green text-white p-5 text-center">
        <div class="w-12 h-12 rounded-full bg-white/15 mx-auto flex items-center justify-center mb-2">
          <i class="fa-solid fa-boxes-stacked text-xl text-emerald-200"></i>
        </div>
        <h1 class="text-lg font-bold">ফাস্টল্যাব ইউনানী</h1>
        <p class="text-xs text-emerald-100">ফ্যাক্টরি অফিসার লগইন প্যানেল</p>
      </div>
      <form id="login-form" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ইউজার আইডি</label>
          <input type="text" id="login-user" required placeholder="ইউজার আইডি লিখুন"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-700" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">পাসওয়ার্ড</label>
          <div class="relative">
            <input type="password" id="login-pass" required placeholder="পাসওয়ার্ড লিখুন"
              class="w-full border border-gray-300 rounded-lg pl-3 pr-10 py-2 text-sm focus:outline-none focus:border-emerald-700" />
            <button type="button" onclick="togglePassword()" aria-label="পাসওয়ার্ড দেখুন বা লুকান"
              class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-emerald-700 cursor-pointer">
              <i id="pass-eye-icon" class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- ভুল পাসওয়ার্ড বা ইউজার এরর মেসেজ -->
        <p id="login-error-msg" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 text-center">
          <i class="fa-solid fa-circle-exclamation mr-1"></i> ভুল ইউজার আইডি বা পাসওয়ার্ড!
        </p>

        <button type="submit"
          class="w-full brand-green hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
        </button>

        <a href="index.html"
          class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-house"></i> হোমে ফিরে যান
        </a>
      </form>
    </div>
  </div>
  <!-- স্টক এন্ট্রি মেইন পেজ -->
  <div id="entry-screen" class="hidden min-h-screen pb-10">
    <!-- হেডার -->
    <header class="brand-green text-white sticky top-0 z-30 shadow">
      <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
        <div>
          <h1 class="text-sm font-bold leading-tight">ফাস্টল্যাব ইউনানী — স্টক এন্ট্রি</h1>
          <p id="logged-user-label" class="text-[11px] text-emerald-200"></p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="logoutStockMan()" class="text-xs bg-rose-600 hover:bg-rose-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
            <i class="fa-solid fa-power-off"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">
      <!-- তারিখ ও বর্তমান স্টক কার্ড -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <div class="flex items-center justify-between gap-2">
          <label class="text-xs font-bold text-gray-700">এন্ট্রির তারিখ:</label>
          <input type="date" id="entry-date" onchange="onItemOrDateChange()"
            class="border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-gray-800 focus:outline-none focus:border-emerald-700" />
        </div>

        <!-- ধরন সিলেকশন ড্রপডাউন -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">স্টকের ধরন (Type)</label>
          <select id="stock-type" onchange="populateItemsDropdown()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 font-semibold focus:outline-none focus:border-emerald-700">
            <option value="finished">ফিনিশড গুডস (Finished Goods)</option>
            <option value="packaging">প্যাকেজিং আইটেম (Packaging Item)</option>
          </select>
        </div>

        <!-- আইটেম সিলেকশন ড্রপডাউন -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">আইটেম / প্রোডাক্ট নির্বাচন</label>
          <select id="stock-item" onchange="onItemOrDateChange()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-emerald-700"></select>
        </div>

        <!-- বর্তমান ওপেনিং / পূর্বের স্টক ডিসপ্লে -->
        <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 flex items-center justify-between">
          <div>
            <span class="block text-[11px] text-emerald-800 font-medium">আজকের ওপেনিং স্টক</span>
            <span id="opening-stock-display" class="text-base font-bold text-emerald-950">0</span>
          </div>
          <div class="text-right">
            <span class="block text-[11px] text-emerald-800 font-medium">আনুমানিক ক্লোজিং/মোট</span>
            <span id="preview-closing-display" class="text-base font-bold text-emerald-700">0</span>
          </div>
        </div>
      </div>
      <!-- সহজ ইনপুট ফর্ম -->
      <form id="stock-entry-form" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <!-- ফিনিশড গুডস ঘরসমূহ -->
        <div id="finished-fields" class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Produced (উৎপাদন)</label>
            <input type="number" step="any" id="fg-produced" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Market Return (রিটার্ন)</label>
            <input type="number" step="any" id="fg-return" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Delivery / Sales (বিক্রি)</label>
            <input type="number" step="any" id="fg-sales" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Sample (স্যাম্পল)</label>
            <input type="number" step="any" id="fg-sample" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <!-- প্যাকেজিং আইটেম ঘরসমূহ -->
        <div id="packaging-fields" class="hidden grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Purchase (ক্রয়/আগমন)</label>
            <input type="number" step="any" id="pkg-purchase" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Used (ব্যবহৃত)</label>
            <input type="number" step="any" id="pkg-used" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Damage (নষ্ট/ড্যামেজ)</label>
            <input type="number" step="any" id="pkg-damage" value="0" oninput="calculatePreview()"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Demand (ফ্যাক্টরি চাহিদা)</label>
            <input type="number" step="any" id="pkg-demand" value="0"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm border-amber-300 bg-amber-50/40" />
          </div>
        </div>

        <button type="submit"
          class="w-full brand-green hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-sm shadow transition flex items-center justify-center gap-2 mt-2 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up"></i> স্টক সেভ ও অ্যাডমিনে পাঠান
        </button>
      </form>
      <!-- আজকের দেওয়া এন্ট্রির তালিকা -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-emerald-700"></i> আজকের এন্ট্রিসমূহ
          </h2>
          <span class="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full font-medium">
            জমার ২ ঘণ্টা পর্যন্ত এডিট চালু
          </span>
        </div>

        <div id="today-entries-list" class="space-y-2 text-xs text-gray-600">
          <p class="text-center text-gray-400 py-3">আজকের কোনো এন্ট্রি পাওয়া যায়নি।</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ফাস্টল্যাব ইউনানী অফিসিয়াল নোটিশ পপ-আপ -->
  <div id="official-notice-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="brand-green text-white px-4 py-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-white text-emerald-900 flex items-center justify-center font-bold">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold leading-tight">ফাস্টল্যাব ইউনানী</h3>
          <p class="text-[11px] text-emerald-100">অফিসিয়াল নোটিশ</p>
        </div>
      </div>
      <div class="p-6 text-center space-y-4">
        <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 mx-auto flex items-center justify-center text-xl">
          <i id="notice-icon" class="fa-solid fa-bell"></i>
        </div>
        <p id="notice-message" class="text-sm font-semibold text-gray-800"></p>
        <div class="flex justify-end pt-1">
          <button type="button" onclick="closeOfficialNotice()"
            class="brand-green-dark text-white text-xs font-semibold px-5 py-2.5 rounded-lg cursor-pointer">
            ঠিক আছে (OK)
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // আপনার ফায়ারবেস কনফিগারেশন এখানে বসান
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase init fallback:", e);
    }

    const STOCK_ITEMS = {
      finished: [
        "FLJ-250ml Orange", "LJ-200ml Orange", "100ml(48Pcs) Oran.",
        "100ml LJ(KP)(48Pcs)", "Fast LJ-200ml Green", "FastLJ-100ml Green",
        "250ml Red", "200ml Red", "100ml Red",
        "250ml Coffee", "200ml Coffee", "100ml Coffee",
        "50ml Coffee", "50ml Red", "50ml(48Pcs)",
        "Chana-Jhal-25g", "Chana-BBQ-25g", "Chan-Bhuj-350g",
        "Chana-Bom-350g", "Motor Vaja-15g", "Chan-Bhuj-800g",
        "Chan-Bom-900g", "Bana Lassa-200g"
      ],
      packaging: [
        "Bottle: 50ml-Bottle", "Bottle: 100ml-Bottle-Old", "Bottle: 100ml-Bottle-Long",
        "Bottle: 200ml-Bottle-Long", "Bottle: 200ml-Bottle-old", "Bottle: 250ml-Bottle-Old",
        "Cap: Orange Cap", "Cap: Red-Cap", "Cap: Green-Cap",
        "Label: 50ml-Label-Red", "Label: 50ml-Label-Black", "Label: 100m-label-Or",
        "Label: 100ml-label-Kp", "Label: 100ml-Label-Green", "Label: 200ml-Label-Or",
        "Label: 200ml-Label-Green", "Label: 250ml-Label-Or",
        "LDPE: 50ml-LDPE", "LDPE: 100ml-LDPE", "LDPE: 250/200 LDPE",
        "Shipers: 50ml-Shipers-red", "Shipers: 50ml-Shipers-Black", "Shipers: 50ml-Shipers-Green",
        "Shipers: 100ml-Shipers-Or", "Shipers: 100ml-Shipers-green", "Shipers: 200ml-Shipers-Or",
        "Shipers: 200ml-Shipers-Green", "Shipers: 250ml-Shipers-Or",
        "Master: 50/100Master", "Master: 100ml-Master-Kp/Or", "Master: 200Ml-Master-Or/G",
        "Master: 250ml-Master-Or", "Master: 100ml- Sipus-KP"
      ]
    };

    let currentOpeningStock = 0;
    let noticeCallback = null;

    function showOfficialNotice(message, isError = false, onOk = null) {
      document.getElementById("notice-message").textContent = message;
      const icon = document.getElementById("notice-icon");
      icon.className = isError ? "fa-solid fa-triangle-exclamation text-rose-600" : "fa-solid fa-bell text-emerald-700";
      noticeCallback = onOk;
      const modal = document.getElementById("official-notice-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeOfficialNotice() {
      const modal = document.getElementById("official-notice-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      if (typeof noticeCallback === "function") {
        const cb = noticeCallback;
        noticeCallback = null;
        cb();
      }
    }
    const SESSION_KEY = "fastlab_stock_user";

    function clearLoginSessionAndShowLogin() {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById("entry-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      const userField = document.getElementById("login-user");
      const passField = document.getElementById("login-pass");
      if (userField) userField.value = "";
      if (passField) {
        passField.value = "";
        passField.type = "password";
      }
      const eyeIcon = document.getElementById("pass-eye-icon");
      if (eyeIcon) {
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    // মোবাইলের ব্যাক বাটন বা পেজ থেকে বের হলে সেশন ক্লিয়ার করা যাতে পরে অটো লগইন না হয়
    window.addEventListener("pagehide", function () {
      clearLoginSessionAndShowLogin();
    });

    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        clearLoginSessionAndShowLogin();
      }
    });

    function togglePassword() {
      const passInput = document.getElementById("login-pass");
      const eyeIcon = document.getElementById("pass-eye-icon");
      if (!passInput) return;

      if (passInput.type === "password") {
        passInput.type = "text";
        if (eyeIcon) {
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        }
      } else {
        passInput.type = "password";
        if (eyeIcon) {
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      }
    }

    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const user = document.getElementById("login-user").value.trim();
      const pass = document.getElementById("login-pass").value.trim();
      const errorBox = document.getElementById("login-error-msg");

      let valid = false;

      if (user === "stockman" && pass === "1234") {
        valid = true;
      }

      if (!valid && db && firebaseConfig && !String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        try {
          const snap = await Promise.race([
            db.ref("stock_users").once("value"),
            new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 3000))
          ]);
          const users = snap && snap.val ? snap.val() : null;
          if (users) {
            for (const key in users) {
              const u = users[key];
              if (u && (u.username === user || key === user) && String(u.password) === pass && u.status !== "blocked") {
                valid = true;
                break;
              }
            }
          }
        } catch (err) {
          // টাইমআউট বা নেটওয়ার্ক এররে ডিফল্ট লগইনই কাজ করবে
        }
      }

      if (valid) {
        if (errorBox) errorBox.classList.add("hidden");
        sessionStorage.setItem(SESSION_KEY, user);
        initEntryScreen(user);
      } else {
        if (errorBox) errorBox.classList.remove("hidden");
        showOfficialNotice("ভুল ইউজার আইডি বা পাসওয়ার্ড দেওয়া হয়েছে!", true);
      }
    });

    function logoutStockMan() {
      clearLoginSessionAndShowLogin();
    }
    function initEntryScreen(user) {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("entry-screen").classList.remove("hidden");
      document.getElementById("logged-user-label").textContent = "ফ্যাক্টরি অফিসার: " + user;
      document.getElementById("entry-date").value = getTodayDateStr();
      populateItemsDropdown();
      loadTodayEntries();
      autoCleanThreeMonthsStock();
    }

    function populateItemsDropdown() {
      const type = document.getElementById("stock-type").value;
      const itemSelect = document.getElementById("stock-item");
      itemSelect.innerHTML = "";

      STOCK_ITEMS[type].forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        itemSelect.appendChild(opt);
      });

      const isFinished = type === "finished";
      document.getElementById("finished-fields").classList.toggle("hidden", !isFinished);
      document.getElementById("finished-fields").classList.toggle("grid", isFinished);
      document.getElementById("packaging-fields").classList.toggle("hidden", isFinished);
      document.getElementById("packaging-fields").classList.toggle("grid", !isFinished);

      onItemOrDateChange();
    }

    async function onItemOrDateChange() {
      const dateStr = document.getElementById("entry-date").value;
      const type = document.getElementById("stock-type").value;
      const item = document.getElementById("stock-item").value;
      if (!dateStr || !item) return;

      currentOpeningStock = 0;
      resetInputs();

      if (db && firebaseConfig && !String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        try {
          const safeKey = encodeURIComponent(item);
          const currentSnap = await db.ref(`daily_stock_logs/${dateStr}/${type}/${safeKey}`).once("value");
          const currentData = currentSnap.val();

          if (currentData) {
            currentOpeningStock = Number(currentData.opening || 0);
            if (type === "finished") {
              document.getElementById("fg-produced").value = currentData.produced || 0;
              document.getElementById("fg-return").value = currentData.marketReturn || 0;
              document.getElementById("fg-sales").value = currentData.sales || 0;
              document.getElementById("fg-sample").value = currentData.sample || 0;
            } else {
              document.getElementById("pkg-purchase").value = currentData.purchase || 0;
              document.getElementById("pkg-used").value = currentData.used || 0;
              document.getElementById("pkg-damage").value = currentData.damage || 0;
              document.getElementById("pkg-demand").value = currentData.demand || 0;
            }
          } else {
            const allLogsSnap = await db.ref("daily_stock_logs").orderByKey().endAt(dateStr).limitToLast(15).once("value");
            const logs = allLogsSnap.val() || {};
            const dates = Object.keys(logs).filter((d) => d < dateStr).sort().reverse();

            for (const d of dates) {
              const rec = logs[d]?.[type]?.[safeKey];
              if (rec) {
                currentOpeningStock = Number(rec.closingStock ?? rec.totalStock ?? 0);
                break;
              }
            }
          }
        } catch (err) {
          console.warn("Stock load fallback:", err);
        }
      }

      document.getElementById("opening-stock-display").textContent = currentOpeningStock;
      calculatePreview();
    }

    function resetInputs() {
      ["fg-produced", "fg-return", "fg-sales", "fg-sample", "pkg-purchase", "pkg-used", "pkg-damage", "pkg-demand"]
        .forEach((id) => { const el = document.getElementById(id); if (el) el.value = 0; });
    }

    function calculatePreview() {
      const type = document.getElementById("stock-type").value;
      let result = currentOpeningStock;

      if (type === "finished") {
        const produced = Number(document.getElementById("fg-produced").value || 0);
        const ret = Number(document.getElementById("fg-return").value || 0);
        const sales = Number(document.getElementById("fg-sales").value || 0);
        const sample = Number(document.getElementById("fg-sample").value || 0);
        result = currentOpeningStock + produced + ret - sales - sample;
      } else {
        const purchase = Number(document.getElementById("pkg-purchase").value || 0);
        const used = Number(document.getElementById("pkg-used").value || 0);
        const damage = Number(document.getElementById("pkg-damage").value || 0);
        result = currentOpeningStock + purchase - used - damage;
      }

      document.getElementById("preview-closing-display").textContent = result;
      return result;
    }

    document.getElementById("stock-entry-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const dateStr = document.getElementById("entry-date").value;
      const type = document.getElementById("stock-type").value;
      const item = document.getElementById("stock-item").value;
      const safeKey = encodeURIComponent(item);
      const updatedBy = sessionStorage.getItem(SESSION_KEY) || "stockman";

      const payload = {
        itemName: item,
        type,
        date: dateStr,
        opening: currentOpeningStock,
        updatedBy,
        updatedAt: Date.now()
      };

      if (type === "finished") {
        const produced = Number(document.getElementById("fg-produced").value || 0);
        const marketReturn = Number(document.getElementById("fg-return").value || 0);
        const sales = Number(document.getElementById("fg-sales").value || 0);
        const sample = Number(document.getElementById("fg-sample").value || 0);
        const totalStock = currentOpeningStock + produced + marketReturn;
        const closingStock = totalStock - sales - sample;

        Object.assign(payload, { produced, marketReturn, sales, sample, totalStock, closingStock });
      } else {
        const purchase = Number(document.getElementById("pkg-purchase").value || 0);
        const used = Number(document.getElementById("pkg-used").value || 0);
        const damage = Number(document.getElementById("pkg-damage").value || 0);
        const demand = Number(document.getElementById("pkg-demand").value || 0);
        const total = currentOpeningStock + purchase;
        const totalStock = total - used - damage;

        Object.assign(payload, { purchase, total, used, damage, totalStock, demand });
      }

      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        showOfficialNotice(`"${item}" এর হিসাব প্রস্তুত হয়েছে (ফায়ারবেস কনফিগ যুক্ত করলে অ্যাডমিনে সিঙ্ক হবে)।`);
        return;
      }

      try {
        await db.ref(`daily_stock_logs/${dateStr}/${type}/${safeKey}`).set(payload);
        autoCleanThreeMonthsStock();
        loadTodayEntries();
        showOfficialNotice(`"${item}" এর স্টক সফলভাবে আপডেট ও অ্যাডমিনে সিঙ্ক হয়েছে!`);
      } catch (err) {
        showOfficialNotice("স্টক সেভ করতে সমস্যা হয়েছে: " + err.message, true);
      }
    });

    function autoCleanThreeMonthsStock() {
      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) return;
      const cutoff = new Date();
      cutoff.setMonth(cutoff.getMonth() - 3);
      const cutoffStr = cutoff.toISOString().split("T")[0];

      db.ref("daily_stock_logs").once("value", (snap) => {
        const logs = snap.val();
        if (!logs) return;
        Object.keys(logs).forEach((d) => {
          if (d < cutoffStr) {
            db.ref(`daily_stock_logs/${d}`).remove();
          }
        });
      });
    }
    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;

    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function canEditEntry(record) {
      if (!record || !record.date || !record.updatedAt) return false;
      const todayStr = getTodayDateStr();
      if (record.date !== todayStr) return false;
      const elapsed = Date.now() - Number(record.updatedAt);
      return elapsed >= 0 && elapsed <= TWO_HOURS_MS;
    }

    function getRemainingEditText(updatedAt) {
      const diffMs = TWO_HOURS_MS - (Date.now() - Number(updatedAt));
      if (diffMs <= 0) return "সময় শেষ";
      const totalMins = Math.ceil(diffMs / 60000);
      const hrs = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      if (hrs > 0) return `${hrs} ঘণ্টা ${mins} মি. বাকি`;
      return `${mins} মিনিট বাকি`;
    }

    async function loadTodayEntries() {
      const listEl = document.getElementById("today-entries-list");
      if (!listEl) return;

      const todayStr = getTodayDateStr();
      const currentUser = sessionStorage.getItem(SESSION_KEY) || "stockman";

      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        listEl.innerHTML = `<p class="text-center text-gray-400 py-2">ফায়ারবেস যুক্ত করলে আজকের এন্ট্রি তালিকা এখানে দেখাবে।</p>`;
        return;
      }

      try {
        const snap = await db.ref(`daily_stock_logs/${todayStr}`).once("value");
        const dayData = snap.val();
        const rows = [];

        if (dayData) {
          ["finished", "packaging"].forEach((type) => {
            const itemsObj = dayData[type];
            if (!itemsObj) return;
            Object.keys(itemsObj).forEach((safeKey) => {
              const rec = itemsObj[safeKey];
              if (!rec) return;
              if (rec.updatedBy && rec.updatedBy !== currentUser) return;
              rows.push({ ...rec, type, safeKey });
            });
          });
        }

        rows.sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));

        if (!rows.length) {
          listEl.innerHTML = `<p class="text-center text-gray-400 py-3">আজকের (${todayStr}) কোনো এন্ট্রি পাওয়া যায়নি।</p>`;
          return;
        }

        listEl.innerHTML = rows.map((rec) => {
          const editable = canEditEntry(rec);
          const typeLabel = rec.type === "finished" ? "ফিনিশড গুডস" : "প্যাকেজিং আইটেম";
          const summaryText = rec.type === "finished"
            ? `ওপেনিং: ${rec.opening || 0} | উৎপাদন: ${rec.produced || 0} | বিক্রি: ${rec.sales || 0} | ক্লোজিং: ${rec.closingStock ?? 0}`
            : `ওপেনিং: ${rec.opening || 0} | ক্রয়: ${rec.purchase || 0} | ব্যবহৃত: ${rec.used || 0} | ডিমান্ড: ${rec.demand || 0} | স্টক: ${rec.totalStock ?? 0}`;

          const encodedItem = encodeURIComponent(rec.itemName || "");
          const actionBtn = editable
            ? `<button type="button" onclick="startEditEntry('${rec.date}', '${rec.type}', '${encodedItem}')"
                class="px-2.5 py-1 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] font-semibold shrink-0 cursor-pointer">
                <i class="fa-solid fa-pen-to-square"></i> এডিট (${getRemainingEditText(rec.updatedAt)})
              </button>`
            : `<span class="px-2 py-1 rounded-lg bg-gray-100 text-gray-500 text-[11px] font-medium shrink-0">
                <i class="fa-solid fa-lock"></i> এডিট লকড
              </span>`;

          return `
            <div class="border border-gray-200 rounded-lg p-2.5 flex items-center justify-between gap-2 bg-gray-50/60">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-bold text-gray-800">${rec.itemName}</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold">${typeLabel}</span>
                </div>
                <p class="text-[11px] text-gray-600 mt-0.5">${summaryText}</p>
              </div>
              ${actionBtn}
            </div>
          `;
        }).join("");
      } catch (err) {
        listEl.innerHTML = `<p class="text-center text-rose-500 py-2">এন্ট্রি তালিকা লোড করা যায়নি।</p>`;
      }
    }

    async function startEditEntry(dateStr, type, encodedItem) {
      const todayStr = getTodayDateStr();
      if (dateStr !== todayStr) {
        showOfficialNotice("শুধুমাত্র আজকের এন্ট্রিই এডিট করা যাবে!", true);
        return;
      }

      const itemName = decodeURIComponent(encodedItem);
      const snap = await db.ref(`daily_stock_logs/${dateStr}/${type}/${encodedItem}`).once("value");
      const rec = snap.val();

      if (!rec) {
        showOfficialNotice("এন্ট্রিটি পাওয়া যায়নি!", true);
        return;
      }

      if (!canEditEntry(rec)) {
        showOfficialNotice("জমা দেওয়ার ২ ঘণ্টা পার হয়ে গেছে, তাই এটি আর এডিট করা যাবে না!", true);
        loadTodayEntries();
        return;
      }

      document.getElementById("entry-date").value = todayStr;
      document.getElementById("stock-type").value = type;
      populateItemsDropdown();

      const itemSelect = document.getElementById("stock-item");
      itemSelect.value = itemName;

      currentOpeningStock = Number(rec.opening || 0);
      document.getElementById("opening-stock-display").textContent = currentOpeningStock;

      if (type === "finished") {
        document.getElementById("fg-produced").value = rec.produced || 0;
        document.getElementById("fg-return").value = rec.marketReturn || 0;
        document.getElementById("fg-sales").value = rec.sales || 0;
        document.getElementById("fg-sample").value = rec.sample || 0;
      } else {
        document.getElementById("pkg-purchase").value = rec.purchase || 0;
        document.getElementById("pkg-used").value = rec.used || 0;
        document.getElementById("pkg-damage").value = rec.damage || 0;
        document.getElementById("pkg-demand").value = rec.demand || 0;
      }

      calculatePreview();
      window.scrollTo({ top: 0, behavior: "smooth" });
      showOfficialNotice(`"${itemName}" এর এন্ট্রি এডিট মোডে লোড হয়েছে। সংশোধন করে সেভ করুন।`);
    }
  </script>
</body>
