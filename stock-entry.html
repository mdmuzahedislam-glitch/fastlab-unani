<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>স্টক ম্যান এন্ট্রি - ফাস্টল্যাব ইউনানী</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #f3f6f4; }
    .brand-green { background-color: #064e3b; }
    .brand-green-dark { background-color: #04392b; }
  </style>
</head>
<body class="min-h-screen text-gray-800">
  <!-- লগইন স্ক্রিন -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden border border-emerald-100">
      <div class="brand-green text-white p-5 text-center">
        <div class="w-12 h-12 rounded-full bg-white/15 mx-auto flex items-center justify-center mb-2">
          <i class="fa-solid fa-boxes-stacked text-xl text-emerald-200"></i>
        </div>
        <h1 class="text-lg font-bold">ফাস্টল্যাব ইউনানী</h1>
        <p class="text-xs text-emerald-100">ফ্যাক্টরি অফিসার লগইন প্যানেল</p>
      </div>
      <form id="login-form" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">ইউজার আইডি</label>
          <input type="text" id="login-user" required placeholder="ইউজার আইডি লিখুন"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-700" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">পাসওয়ার্ড</label>
          <div class="relative">
            <input type="password" id="login-pass" required placeholder="পাসওয়ার্ড লিখুন"
              class="w-full border border-gray-300 rounded-lg pl-3 pr-10 py-2 text-sm focus:outline-none focus:border-emerald-700" />
            <button type="button" onclick="togglePassword()" aria-label="পাসওয়ার্ড দেখুন বা লুকান"
              class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-emerald-700 cursor-pointer">
              <i id="pass-eye-icon" class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- ভুল পাসওয়ার্ড বা ইউজার এরর মেসেজ -->
        <p id="login-error-msg" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2 text-center">
          <i class="fa-solid fa-circle-exclamation mr-1"></i> ভুল ইউজার আইডি বা পাসওয়ার্ড!
        </p>

        <button type="submit"
          class="w-full brand-green hover:bg-emerald-900 text-white font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
        </button>

        <a href="index.html"
          class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-house"></i> হোমে ফিরে যান
        </a>
      </form>
    </div>
  </div>
  <!-- স্টক এন্ট্রি মেইন পেজ -->
  <div id="entry-screen" class="hidden min-h-screen pb-10">
    <!-- হেডার -->
    <header class="brand-green text-white sticky top-0 z-30 shadow">
      <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
        <div>
          <h1 class="text-sm font-bold leading-tight">ফাস্টল্যাব ইউনানী — স্টক এন্ট্রি</h1>
          <p id="logged-user-label" class="text-[11px] text-emerald-200"></p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="logoutStockMan()" class="text-xs bg-rose-600 hover:bg-rose-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
            <i class="fa-solid fa-power-off"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">
      <!-- স্টোকস এন্ট্রি ফর্ম -->
      <form id="stock-entry-form" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <div class="flex items-center justify-between border-b border-gray-100 pb-2">
          <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-emerald-700"></i> স্টোকস এন্ট্রি ফর্ম
          </h2>
          <span id="edit-mode-badge" class="hidden text-[11px] font-semibold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">
            এডিট মোড চালু
          </span>
        </div>

        <!-- তারিখ -->
        <div class="flex items-center justify-between gap-2">
          <label for="entry-date" class="text-xs font-bold text-gray-700">তারিখ</label>
          <input type="date" id="entry-date" required onchange="onSelectionChange()"
            class="border border-gray-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-gray-800 focus:outline-none focus:border-emerald-700" />
        </div>

        <!-- প্রডাক্টের ক্যাটাগরি -->
        <div>
          <label for="product-category" class="block text-xs font-bold text-gray-700 mb-1">প্রডাক্টের ক্যাটাগরি</label>
          <select id="product-category" onchange="onCategoryChange()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 font-semibold focus:outline-none focus:border-emerald-700">
            <option value="finished">ফিনিশগুডস</option>
            <option value="packaging">প্যাকেজিং আইটেম</option>
            <option value="raw_chemical">র / কেমিক্যাল</option>
          </select>
        </div>

        <!-- প্রডাক্টের নাম -->
        <div>
          <label for="product-name" class="block text-xs font-bold text-gray-700 mb-1">প্রডাক্টের নাম</label>
          <select id="product-name" onchange="onSelectionChange()"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-emerald-700"></select>
        </div>

        <!-- স্টোকস টাইপ ও পরিমাপ একক -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="stock-type" class="block text-xs font-bold text-gray-700 mb-1">স্টোকস টাইপ</label>
            <select id="stock-type" onchange="updateQuantityLabel(); onSelectionChange();"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-gray-50 font-semibold focus:outline-none focus:border-emerald-700">
              <option value="production">উৎপাদন</option>
              <option value="purchase">ক্রয়</option>
              <option value="delivery">ডেলিভারি</option>
              <option value="damage">ড্যামেজ</option>
              <option value="demand">ডিমান্ড</option>
            </select>
          </div>

          <div>
            <label for="measure-unit" class="block text-xs font-bold text-gray-700 mb-1">পরিমাপ একক</label>
            <select id="measure-unit"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-emerald-700">
              <option value="পিছ">পিছ</option>
              <option value="কেজি">কেজি</option>
              <option value="লিটার">লিটার</option>
              <option value="ব্যাগ">ব্যাগ</option>
              <option value="ড্রাম">ড্রাম</option>
              <option value="জার">জার</option>
            </select>
          </div>
        </div>

        <!-- ডাইনামিক পরিমাপ ঘর -->
        <div>
          <label id="dynamic-qty-label" for="stock-qty" class="block text-xs font-bold text-emerald-900 mb-1">
            উৎপাদনের পরিমান
          </label>
          <input type="number" step="any" min="0" id="stock-qty" value="0" required placeholder="উৎপাদনের পরিমান লিখুন"
            class="w-full border border-emerald-300 bg-emerald-50/40 rounded-lg px-3 py-2.5 text-sm font-semibold text-gray-800 focus:outline-none focus:border-emerald-700" />
        </div>

        <button type="submit"
          class="w-full brand-green hover:bg-emerald-900 text-white font-bold py-3 rounded-xl text-sm shadow transition flex items-center justify-center gap-2 mt-2 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up"></i> স্টক সেভ ও অ্যাডমিনে পাঠান
        </button>
      </form>

      <!-- আজকের দেওয়া এন্ট্রির তালিকা -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <h2 class="text-sm font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-emerald-700"></i> আজকের এন্ট্রিসমূহ
          </h2>
          <span class="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full font-medium">
            জমার ২ ঘণ্টা পর্যন্ত এডিট চালু
          </span>
        </div>

        <div id="today-entries-list" class="space-y-2 text-xs text-gray-600">
          <p class="text-center text-gray-400 py-3">আজকের কোনো এন্ট্রি পাওয়া যায়নি।</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ফাস্টল্যাব ইউনানী অফিসিয়াল নোটিশ পপ-আপ -->
  <div id="official-notice-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">
      <div class="brand-green text-white px-4 py-3 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-white text-emerald-900 flex items-center justify-center font-bold">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold leading-tight">ফাস্টল্যাব ইউনানী</h3>
          <p class="text-[11px] text-emerald-100">অফিসিয়াল নোটিশ</p>
        </div>
      </div>
      <div class="p-6 text-center space-y-4">
        <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 mx-auto flex items-center justify-center text-xl">
          <i id="notice-icon" class="fa-solid fa-bell"></i>
        </div>
        <p id="notice-message" class="text-sm font-semibold text-gray-800"></p>
        <div class="flex justify-end pt-1">
          <button type="button" onclick="closeOfficialNotice()"
            class="brand-green-dark text-white text-xs font-semibold px-5 py-2.5 rounded-lg cursor-pointer">
            ঠিক আছে (OK)
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // আপনার ফায়ারবেস কনফিগারেশন এখানে বসান
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();
    } catch (e) {
      console.warn("Firebase init fallback:", e);
    }

    const CATEGORY_PRODUCTS = {
      finished: [
        "২৫০মিলি",
        "২০০মিলি",
        "১০০মিলি",
        "৫০মিলি",
        "FLJ-250ml Orange",
        "LJ-200ml Orange",
        "250ml Red",
        "200ml Red",
        "100ml Red"
      ],
      packaging: [
        "২৫০মিলি বোতল",
        "২০০মিলি বোতল",
        "১০০মিলি বোতল",
        "৫০মিলি বোতল",
        "ক্যাপ (Cap)",
        "লেবেল (Label)",
        "শিপার কার্টন (Shipper)",
        "মাস্টার কার্টন (Master)"
      ],
      raw_chemical: [
        "২৫০মিলি র-মেটেরিয়াল",
        "২০০মিলি র-মেটেরিয়াল",
        "গ্লিসারিন / কেমিক্যাল",
        "প্রিজারভেটিভ",
        "সুগন্ধি / এসেন্স"
      ]
    };

    const CATEGORY_LABELS = {
      finished: "ফিনিশগুডস",
      packaging: "প্যাকেজিং আইটেম",
      raw_chemical: "র / কেমিক্যাল"
    };

    const STOCK_TYPE_LABELS = {
      production: "উৎপাদনের পরিমান",
      purchase: "ক্রয়ের পরিমান",
      delivery: "ডেলিভারির পরিমান",
      damage: "ড্যামেজের পরিমান",
      demand: "ডিমান্ডের পরিমান"
    };

    const STOCK_TYPE_SHORT = {
      production: "উৎপাদন",
      purchase: "ক্রয়",
      delivery: "ডেলিভারি",
      damage: "ড্যামেজ",
      demand: "ডিমান্ড"
    };

    const SESSION_KEY = "fastlab_stock_user";
    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
    let noticeCallback = null;
    let editingRecordKey = null;

    function showOfficialNotice(message, isError = false, onOk = null) {
      document.getElementById("notice-message").textContent = message;
      const icon = document.getElementById("notice-icon");
      icon.className = isError ? "fa-solid fa-triangle-exclamation text-rose-600" : "fa-solid fa-bell text-emerald-700";
      noticeCallback = onOk;
      const modal = document.getElementById("official-notice-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeOfficialNotice() {
      const modal = document.getElementById("official-notice-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      if (typeof noticeCallback === "function") {
        const cb = noticeCallback;
        noticeCallback = null;
        cb();
      }
    }

    function clearLoginSessionAndShowLogin() {
      sessionStorage.removeItem(SESSION_KEY);
      editingRecordKey = null;
      document.getElementById("edit-mode-badge").classList.add("hidden");
      document.getElementById("entry-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");

      const userField = document.getElementById("login-user");
      const passField = document.getElementById("login-pass");
      if (userField) userField.value = "";
      if (passField) {
        passField.value = "";
        passField.type = "password";
      }
      const eyeIcon = document.getElementById("pass-eye-icon");
      if (eyeIcon) {
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
      }
    }

    // মোবাইলের ব্যাক বাটন বা পেজ থেকে বের হলে সেশন ক্লিয়ার করা যাতে পরে অটো লগইন না হয়
    window.addEventListener("pagehide", function () {
      clearLoginSessionAndShowLogin();
    });

    window.addEventListener("pageshow", function (event) {
      if (event.persisted) {
        clearLoginSessionAndShowLogin();
      }
    });

    function togglePassword() {
      const passInput = document.getElementById("login-pass");
      const eyeIcon = document.getElementById("pass-eye-icon");
      if (!passInput) return;

      if (passInput.type === "password") {
        passInput.type = "text";
        if (eyeIcon) {
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        }
      } else {
        passInput.type = "password";
        if (eyeIcon) {
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      }
    }

    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const user = document.getElementById("login-user").value.trim();
      const pass = document.getElementById("login-pass").value.trim();
      const errorBox = document.getElementById("login-error-msg");

      let valid = false;

      if (user === "stockman" && pass === "1234") {
        valid = true;
      }

      if (!valid && db && firebaseConfig && !String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        try {
          const snap = await Promise.race([
            db.ref("stock_users").once("value"),
            new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 3000))
          ]);
          const users = snap && snap.val ? snap.val() : null;
          if (users) {
            for (const key in users) {
              const u = users[key];
              if (u && (u.username === user || key === user) && String(u.password) === pass && u.status !== "blocked") {
                valid = true;
                break;
              }
            }
          }
        } catch (err) {
          // টাইমআউট বা নেটওয়ার্ক এররে ডিফল্ট লগইনই কার্যকর থাকবে
        }
      }

      if (valid) {
        if (errorBox) errorBox.classList.add("hidden");
        sessionStorage.setItem(SESSION_KEY, user);
        initEntryScreen(user);
      } else {
        if (errorBox) errorBox.classList.remove("hidden");
        showOfficialNotice("ভুল ইউজার আইডি বা পাসওয়ার্ড দেওয়া হয়েছে!", true);
      }
    });

    function logoutStockMan() {
      clearLoginSessionAndShowLogin();
    }

    function getTodayDateStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function initEntryScreen(user) {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("entry-screen").classList.remove("hidden");
      document.getElementById("logged-user-label").textContent = "ফ্যাক্টরি অফিসার: " + user;
      document.getElementById("entry-date").value = getTodayDateStr();
      onCategoryChange();
      updateQuantityLabel();
      loadTodayEntries();
      autoCleanThreeMonthsStock();
    }

    function onCategoryChange() {
      const category = document.getElementById("product-category").value || "finished";
      const productSelect = document.getElementById("product-name");
      if (!productSelect) return;

      productSelect.innerHTML = "";
      (CATEGORY_PRODUCTS[category] || []).forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item;
        opt.textContent = item;
        productSelect.appendChild(opt);
      });

      onSelectionChange();
    }

    function updateQuantityLabel() {
      const stockType = document.getElementById("stock-type").value || "production";
      const labelText = STOCK_TYPE_LABELS[stockType] || "পরিমাপ";
      const labelEl = document.getElementById("dynamic-qty-label");
      const inputEl = document.getElementById("stock-qty");

      if (labelEl) {
        labelEl.textContent = labelText;
      }
      if (inputEl) {
        inputEl.placeholder = `${labelText} লিখুন`;
      }
    }

    function buildEntryKey(category, productName, stockType) {
      return encodeURIComponent(`${category}__${productName}__${stockType}`);
    }

    async function onSelectionChange() {
      const dateStr = document.getElementById("entry-date").value;
      const category = document.getElementById("product-category").value;
      const productName = document.getElementById("product-name").value;
      const stockType = document.getElementById("stock-type").value;
      if (!dateStr || !category || !productName || !stockType) return;

      const entryKey = buildEntryKey(category, productName, stockType);
      if (editingRecordKey && editingRecordKey !== entryKey) {
        editingRecordKey = null;
        document.getElementById("edit-mode-badge").classList.add("hidden");
      }

      document.getElementById("stock-qty").value = 0;

      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) return;

      try {
        const snap = await db.ref(`daily_stock_logs/${dateStr}/${entryKey}`).once("value");
        const rec = snap.val();
        if (rec) {
          document.getElementById("stock-qty").value = Number(rec.quantity || 0);
          if (rec.unit) {
            document.getElementById("measure-unit").value = rec.unit;
          }
        }
      } catch (err) {
        console.warn("Entry load error:", err);
      }
    }

    document.getElementById("stock-entry-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const dateStr = document.getElementById("entry-date").value;
      const category = document.getElementById("product-category").value;
      const productName = document.getElementById("product-name").value;
      const stockType = document.getElementById("stock-type").value;
      const unit = document.getElementById("measure-unit").value;
      const quantity = Number(document.getElementById("stock-qty").value || 0);
      const updatedBy = sessionStorage.getItem(SESSION_KEY) || "stockman";
      const entryKey = buildEntryKey(category, productName, stockType);

      if (!dateStr || !productName) return;

      if (editingRecordKey && db && firebaseConfig && !String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        const existingSnap = await db.ref(`daily_stock_logs/${dateStr}/${editingRecordKey}`).once("value");
        const existingRec = existingSnap.val();
        if (existingRec && !canEditEntry(existingRec)) {
          editingRecordKey = null;
          document.getElementById("edit-mode-badge").classList.add("hidden");
          showOfficialNotice("জমা দেওয়ার ২ ঘণ্টা পার হয়ে গেছে, তাই এটি আর এডিট করা যাবে না!", true);
          loadTodayEntries();
          return;
        }
      }

      const payload = {
        entryKey,
        date: dateStr,
        category,
        categoryLabel: CATEGORY_LABELS[category] || category,
        productName,
        stockType,
        stockTypeLabel: STOCK_TYPE_SHORT[stockType] || stockType,
        quantityLabel: STOCK_TYPE_LABELS[stockType] || "পরিমাপ",
        unit,
        quantity,
        updatedBy,
        updatedAt: Date.now()
      };

      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        showOfficialNotice(`${productName} (${STOCK_TYPE_SHORT[stockType]}: ${quantity} ${unit}) প্রস্তুত হয়েছে।`);
        return;
      }

      try {
        await db.ref(`daily_stock_logs/${dateStr}/${entryKey}`).set(payload);
        editingRecordKey = null;
        document.getElementById("edit-mode-badge").classList.add("hidden");
        autoCleanThreeMonthsStock();
        loadTodayEntries();
        showOfficialNotice(`"${productName}" (${STOCK_TYPE_SHORT[stockType]}) এর এন্ট্রি সফলভাবে সেভ ও সিঙ্ক হয়েছে!`);
      } catch (err) {
        showOfficialNotice("স্টক সেভ করতে সমস্যা হয়েছে: " + err.message, true);
      }
    });

    function canEditEntry(record) {
      if (!record || !record.date || !record.updatedAt) return false;
      const todayStr = getTodayDateStr();
      if (record.date !== todayStr) return false;
      const elapsed = Date.now() - Number(record.updatedAt);
      return elapsed >= 0 && elapsed <= TWO_HOURS_MS;
    }

    function getRemainingEditText(updatedAt) {
      const diffMs = TWO_HOURS_MS - (Date.now() - Number(updatedAt));
      if (diffMs <= 0) return "সময় শেষ";
      const totalMins = Math.ceil(diffMs / 60000);
      const hrs = Math.floor(totalMins / 60);
      const mins = totalMins % 60;
      if (hrs > 0) return `${hrs} ঘণ্টা ${mins} মি. বাকি`;
      return `${mins} মিনিট বাকি`;
    }

    async function loadTodayEntries() {
      const listEl = document.getElementById("today-entries-list");
      if (!listEl) return;

      const todayStr = getTodayDateStr();
      const currentUser = sessionStorage.getItem(SESSION_KEY) || "stockman";

      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) {
        listEl.innerHTML = `<p class="text-center text-gray-400 py-2">ফায়ারবেস যুক্ত করলে আজকের এন্ট্রি তালিকা এখানে দেখাবে।</p>`;
        return;
      }

      try {
        const snap = await db.ref(`daily_stock_logs/${todayStr}`).once("value");
        const dayData = snap.val();
        const rows = [];

        if (dayData) {
          Object.keys(dayData).forEach((key) => {
            const rec = dayData[key];
            if (!rec) return;
            if (rec.updatedBy && rec.updatedBy !== currentUser) return;
            rows.push({ ...rec, storageKey: key });
          });
        }

        rows.sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));

        if (!rows.length) {
          listEl.innerHTML = `<p class="text-center text-gray-400 py-3">আজকের (${todayStr}) কোনো এন্ট্রি পাওয়া যায়নি।</p>`;
          return;
        }

        listEl.innerHTML = rows.map((rec) => {
          const editable = canEditEntry(rec);
          const catLabel = rec.categoryLabel || CATEGORY_LABELS[rec.category] || rec.category || "";
          const typeShort = rec.stockTypeLabel || STOCK_TYPE_SHORT[rec.stockType] || rec.stockType || "";
          const safeStorageKey = encodeURIComponent(rec.storageKey);

          const actionBtn = editable
            ? `<button type="button" onclick="startEditEntry('${rec.date}', '${safeStorageKey}')"
                class="px-2.5 py-1 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] font-semibold shrink-0 cursor-pointer">
                <i class="fa-solid fa-pen-to-square"></i> এডিট (${getRemainingEditText(rec.updatedAt)})
              </button>`
            : `<span class="px-2 py-1 rounded-lg bg-gray-100 text-gray-500 text-[11px] font-medium shrink-0">
                <i class="fa-solid fa-lock"></i> এডিট লকড
              </span>`;

          return `
            <div class="border border-gray-200 rounded-lg p-2.5 flex items-center justify-between gap-2 bg-gray-50/60">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="font-bold text-gray-800">${rec.productName || ""}</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-semibold">${catLabel}</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 font-semibold">${typeShort}</span>
                </div>
                <p class="text-[11px] text-gray-700 font-semibold mt-0.5">
                  ${rec.quantityLabel || "পরিমাপ"}: ${rec.quantity ?? 0} ${rec.unit || ""}
                </p>
              </div>
              ${actionBtn}
            </div>
          `;
        }).join("");
      } catch (err) {
        listEl.innerHTML = `<p class="text-center text-rose-500 py-2">এন্ট্রি তালিকা লোড করা যায়নি।</p>`;
      }
    }

    async function startEditEntry(dateStr, encodedStorageKey) {
      const todayStr = getTodayDateStr();
      if (dateStr !== todayStr) {
        showOfficialNotice("শুধুমাত্র আজকের এন্ট্রিই এডিট করা যাবে!", true);
        return;
      }

      const snap = await db.ref(`daily_stock_logs/${dateStr}/${encodedStorageKey}`).once("value");
      const rec = snap.val();

      if (!rec) {
        showOfficialNotice("এন্ট্রিটি পাওয়া যায়নি!", true);
        return;
      }

      if (!canEditEntry(rec)) {
        editingRecordKey = null;
        document.getElementById("edit-mode-badge").classList.add("hidden");
        showOfficialNotice("জমা দেওয়ার ২ ঘণ্টা পার হয়ে গেছে, তাই এটি আর এডিট করা যাবে না!", true);
        loadTodayEntries();
        return;
      }

      editingRecordKey = encodedStorageKey;
      document.getElementById("edit-mode-badge").classList.remove("hidden");

      document.getElementById("entry-date").value = todayStr;
      document.getElementById("product-category").value = rec.category || "finished";
      onCategoryChange();

      const productSelect = document.getElementById("product-name");
      if (rec.productName) {
        const exists = Array.from(productSelect.options).some((o) => o.value === rec.productName);
        if (!exists) {
          const opt = document.createElement("option");
          opt.value = rec.productName;
          opt.textContent = rec.productName;
          productSelect.appendChild(opt);
        }
        productSelect.value = rec.productName;
      }

      document.getElementById("stock-type").value = rec.stockType || "production";
      updateQuantityLabel();

      if (rec.unit) {
        document.getElementById("measure-unit").value = rec.unit;
      }
      document.getElementById("stock-qty").value = Number(rec.quantity || 0);

      window.scrollTo({ top: 0, behavior: "smooth" });
      showOfficialNotice(`"${rec.productName}" এর এন্ট্রি এডিট মোডে লোড হয়েছে। সংশোধন করে সেভ করুন।`);
    }

    function autoCleanThreeMonthsStock() {
      if (!db || !firebaseConfig || String(firebaseConfig.apiKey).includes("YOUR_API_KEY")) return;
      const cutoff = new Date();
      cutoff.setMonth(cutoff.getMonth() - 3);
      const cutoffStr = cutoff.toISOString().split("T")[0];

      db.ref("daily_stock_logs").once("value", (snap) => {
        const logs = snap.val();
        if (!logs) return;
        Object.keys(logs).forEach((d) => {
          if (d < cutoffStr) {
            db.ref(`daily_stock_logs/${d}`).remove();
          }
        });
      });
    }
  </script>
