<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন লগইন - ফাস্টল্যাব ইউনানী</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f0fdf4; }
        .forest-green { background-color: #064e3b; }
        .forest-green-text { color: #064e3b; }
        .forest-green-border { border-color: #064e3b; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center" style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1200&q=80')">

    <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full border-t-4 forest-green-border">
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-green-100 rounded-full text-green-800 mb-2">
                <i class="fa-solid fa-leaf text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold forest-green-text">ফাস্টল্যাব ইউনানী</h1>
            <p class="text-xs text-gray-500 mt-0.5">আফুরিয়া, পাবনা</p>
            <div class="mt-4 inline-flex items-center gap-2 bg-green-50 px-4 py-1.5 rounded-full text-green-800 font-medium text-sm border border-green-200">
                <i class="fa-solid fa-user-shield"></i> <span>এডমিন লগইন প্যানেল</span>
            </div>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">ইউজারনেম (Username)</label>
                <input type="text" id="admin-user" required placeholder="admin" class="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">পাসওয়ার্ড (Password)</label>
                <input type="password" id="admin-pass" required placeholder="admin123" class="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700">
            </div>
            <button type="submit" class="w-full forest-green text-white py-3 rounded-lg font-semibold hover:bg-green-900 transition shadow-md text-sm">
                লগইন করুন
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="index.html" class="inline-flex items-center gap-2 text-sm text-green-800 hover:underline font-medium">
                <i class="fa-solid fa-house"></i> হোম পেজে ফিরে যান
            </a>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();
            
            // ডিফল্ট ইউজারনেম ও পাসওয়ার্ড চেক
            if(user === "admin" && pass === "admin123") {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = "admin-dashboard.html";
            } else {
                alert("ভুল ইউজারনেম বা পাসওয়ার্ড! দয়া করে সঠিক তথ্য দিন।");
            }
        }
    </script>
</body>
</html>
