<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন লগইন - ফাস্টল্যাব ইউনানী</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        redTheme: {
                            DEFAULT: '#dc2626',
                            dark: '#991b1b',
                            light: '#ef4444',
                            bg: '#fef2f2'
                        }
                    },
                    fontFamily: {
                        sans: ['"Hind Siliguri"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-redTheme-bg text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Login Card Wrapper -->
    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl overflow-hidden border border-red-100">
        
        <!-- Top Header with Red Gradient -->
        <div class="bg-gradient-to-r from-redTheme-dark via-redTheme to-redTheme-light text-white p-6 text-center relative">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-inner border border-white/30">
                <i class="fa-solid fa-shield-halved text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">ফাস্টল্যাব ইউনানী</h1>
            <p class="text-xs text-red-100 mt-1 font-medium">অফিসিয়াল এডমিন সিকিউরড লগইন প্যানেল</p>
        </div>

        <!-- Login Form Section -->
        <div class="p-6 sm:p-8">
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">এডমিন ইউজারনেম / ইমেইল</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="admin-user" required placeholder="ইউজারনেম লিখুন" class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">গোপন পাসওয়ার্ড</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="admin-pass" required placeholder="••••••••" class="w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 active:bg-red-800 text-white py-3 rounded-lg font-bold text-sm transition shadow-lg flex items-center justify-center gap-2 cursor-pointer mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
                </button>
            </form>

            <div class="mt-6 text-center border-t pt-4">
                <a href="index.html" class="text-xs text-red-600 hover:underline font-semibold flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> হোম পেজে ফিরে যান
                </a>
            </div>
        </div>

    </div>

    <!-- Script for Login Validation -->
    <script>
    function handleAdminLogin(e) {
        e.preventDefault();
        const user = document.getElementById('admin-user').value;
        const pass = document.getElementById('admin-pass').value;

        if(user === "fastlab10" && pass === "F1234*") {
            // localStorage এবং sessionStorage উভয় স্থানেই লগইন স্ট্যাটাস সেভ করে দেওয়া
            localStorage.setItem('isAdminLoggedIn', 'true');
            sessionStorage.setItem('isAdminLoggedIn', 'true');
            
            alert("লগইন সফল হয়েছে!");
            // সরাসরি ড্যাশবোর্ডে পাঠিয়ে দেওয়া
            window.location.href = "admin-dashboard.html";
        } else {
            alert("❌ ভুল ইউজারনেম অথবা পাসওয়ার্ড!");
        }
    }
    </script>
    

</body>
</html>
